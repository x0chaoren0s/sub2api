# Orbiqo: orbiqo.cc -> 127.0.0.1:18080
# 证书由 acme.sh 签发并安装到 /etc/nginx/ssl/（与同机其他站点一致）。
# 首次签证书前，443 的 server 块需要先注释掉（证书文件还不存在），只保留 80。

map $http_upgrade $orbiqo_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name orbiqo.cc www.orbiqo.cc;

    # acme.sh webroot 校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://orbiqo.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.orbiqo.cc;

    ssl_certificate     /etc/nginx/ssl/orbiqo.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/orbiqo.cc.key;

    return 301 https://orbiqo.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orbiqo.cc;

    ssl_certificate     /etc/nginx/ssl/orbiqo.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/orbiqo.cc.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 大上下文与多模态请求由应用层限制，Nginx 不重复截断。
    client_max_body_size 0;
    client_body_buffer_size 4m;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # 注意：Codex 的 session_id 等带下划线的请求头会被 nginx 默认丢弃（粘性会话失效）。
    # underscores_in_headers 必须配在 http 级别，会影响同机其他站点，所以这里没有开启。

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orbiqo_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;           # SSE 流式输出必须关闭缓冲
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
